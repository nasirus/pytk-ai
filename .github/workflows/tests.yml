name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run filter tests
        run: python -m unittest discover -s tests -p "test_filters_*.py" -v

      - name: Run plan tests
        run: python -m unittest discover -s tests -p "test_plan_*.py" -v

      - name: Run runner and CLI tests
        run: python -m unittest discover -s tests -p "test_runner*.py" -v && python -m unittest discover -s tests -p "test_cli_*.py" -v

  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run fixture tests
        run: python -m unittest discover -s tests -p "test_fixtures_*.py" -v

  live-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff mypy

      - name: Run live tests
        run: python -m unittest discover -s tests -p "test_live_*.py" -v
